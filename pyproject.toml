[tool.ruff]
target-version = "py38"
line-length = 120
src = ["pyiikocloudapi"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "UP007",  # use X | Y for union types (keep Optional for 3.8 compat)
    "RUF001", # ambiguous unicode characters (Cyrillic strings are intentional)
    "RUF003", # ambiguous unicode characters in comments (Cyrillic comments are intentional)
    "RUF013", # implicit Optional (keep existing signatures for backward compat)
    "B904",   # raise ... from err (preserve existing exception chaining behavior)
]

[tool.ruff.lint.isort]
known-first-party = ["pyiikocloudapi"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
